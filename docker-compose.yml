services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 5000
      APP_ORIGINS: http://localhost:3000
      DATABASE_URL: ""
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 8s
    restart: unless-stopped
    networks:
      - skja-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - skja-network

networks:
  skja-network:
    driver: bridge
