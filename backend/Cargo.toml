[package]
name = "skja-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["rand"] }
axum = { version = "0.8.1", features = ["multipart", "macros", "ws"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
http = "1.2.0"
rand = "0.9.0"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
time = { version = "0.3.37", features = ["formatting", "macros"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.2", features = ["cors", "limit", "request-id", "set-header", "timeout", "trace"] }
urlencoding = "2.1.3"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
futures-util = "0.3.31"
rand_core = { version = "0.6", features = ["getrandom"] }
